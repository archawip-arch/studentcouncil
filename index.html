<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สภานักเรียน</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#dff0ff;--sky2:#b9dcf9;--ink:#27445f;--sun:#ffe48a;--sun2:#ffd04a;--grey:#e6e9ec;--greyt:#8a949d;--bg:#f6fbff;--card:#fff;--err:#c0392b}
@media (prefers-color-scheme:dark){:root{--sky:#1c3347;--sky2:#2b4d68;--ink:#e8f3ff;--sun:#5a4a12;--sun2:#e2b92e;--grey:#2a3138;--greyt:#8c98a3;--bg:#10202d;--card:#182d3d}}
*{box-sizing:border-box}
body{margin:0;font-family:Mali,'Noto Sans Thai',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:16px}
h1,h2{margin:0 0 8px}
input,button,select,textarea{font:inherit}
input{width:100%;padding:12px 14px;border:2px solid var(--sky2);border-radius:14px;background:var(--card);color:var(--ink);margin:6px 0}
select{background:var(--card);color:var(--ink);border:2px solid var(--sky2)}
input:focus,button:focus-visible{outline:3px solid var(--sun2);outline-offset:1px}
.btn{background:var(--sun2);color:#3a2f00;border:0;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}
.btn.alt{background:var(--sky2);color:var(--ink)}
.box{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 4px 0 var(--sky2)}
.banner{border-radius:22px;padding:28px 18px;background:var(--sun) center/cover;font-size:1.3rem;font-weight:700;margin-bottom:16px;min-height:110px;display:flex;align-items:flex-end}
.banner span{background:var(--card);padding:6px 12px;border-radius:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mod{border:0;border-radius:20px;padding:18px 10px;background:var(--sky);color:var(--ink);font-weight:700;cursor:pointer;box-shadow:0 4px 0 var(--sky2);text-align:center}
.mod:nth-child(odd){background:var(--sun);box-shadow:0 4px 0 var(--sun2)}
.mod .ic{font-size:2rem;display:block}
.mod.off{background:var(--grey)!important;color:var(--greyt);box-shadow:0 4px 0 #cfd4d9;filter:grayscale(1)}
.mod small{display:block;font-weight:400}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.top button{width:auto;margin:0;padding:8px 12px}
#spin{position:fixed;inset:0;background:rgba(246,251,255,.7);display:none;align-items:center;justify-content:center;z-index:9}
#spin i{width:48px;height:48px;border:6px solid var(--sky2);border-top-color:var(--sun2);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:8;padding:20px}
#pop .box{text-align:center;max-width:320px}
#pop .cute{font-size:4rem;display:inline-block;animation:b .6s ease-in-out infinite alternate}
@keyframes b{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-12px) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){#pop .cute,#spin i{animation-duration:3s}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;display:none;z-index:10;max-width:90%}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row input[type=checkbox]{width:24px;height:24px;margin:0}
.muted{color:var(--greyt);font-size:.9rem}
hr{border:0;border-top:2px dashed var(--sky2);margin:18px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="spin"><i></i></div>
<div id="pop"><div class="box"><div class="cute">🐣</div><h2>ยังไม่เปิดบริการน้าาา</h2>
